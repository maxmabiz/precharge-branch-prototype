<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代发预充审批原型</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      color: rgba(0, 0, 0, 0.88);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 72px; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    .lead { margin: 0 0 28px; color: rgba(0, 0, 0, 0.65); line-height: 1.6; }
    .cards { display: grid; gap: 12px; }
    a.card {
      display: block;
      padding: 18px 20px;
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
    }
    a.card:hover { border-color: #1677ff; }
    a.card strong { display: block; font-size: 16px; font-weight: 600; }
    a.card span { display: block; margin-top: 6px; color: rgba(0, 0, 0, 0.45); font-size: 13px; line-height: 1.5; }
    .doc {
      margin-top: 20px;
      font-size: 14px;
    }
    .doc a { color: #1677ff; text-decoration: none; }
    .doc a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>代发预充审批原型</h1>
    <p class="lead">转账审核里的预充弹窗，和飞书「代发预充申请」表单，放在同一站点。</p>
    <div class="cards">
      <a class="card" href="review/">
        <strong>转账审核 · 预充弹窗</strong>
        <span>运营部业务组必选。点击输入框后搜索；交付中心业务组由交付中心负责人审批。</span>
      </a>
      <a class="card" href="form/">
        <strong>飞书表单 · 代发预充申请</strong>
        <span>表单顶部为运营部业务组。属于交付中心时，由交付中心负责人审批。</span>
      </a>
    </div>
    <p class="doc">需求说明：<a href="https://bestfulfill.feishu.cn/wiki/RST4woQUsiJ3yFkPdu9czQxlntc" target="_blank" rel="noopener">代发预充审批按业务组分支</a></p>
  </main>
</body>
</html>
